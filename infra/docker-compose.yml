x-build-image: &build-image ghcr.io/humanaxiom/sfu-digital-twin/wayfinding-build@sha256:PUBLISHED_DIGEST_REQUIRED

x-common: &common
  image: *build-image
  working_dir: /workspace
  volumes:
    - ..:/workspace:rw
    - ../build:/workspace/build:rw
  command: ["sleep", "infinity"]
  healthcheck:
    test: ["CMD-SHELL", "python --version >/dev/null && ogrinfo --version >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 5s

services:
  artifact:
    <<: *common

  source-etl:
    <<: *common
    volumes:
      - ..:/workspace:rw
      - ../build:/workspace/build:rw
      - C:/repos/sfudt/claude/dtwin-harness/data/IndoorWayfinding.gdb:/data/IndoorWayfinding.gdb:ro

  demo:
    image: *build-image
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/packages/wayfinding/src
    volumes:
      - ..:/workspace:ro
      - ../build/wayfinding.gpkg:/data/wayfinding.gpkg:ro
    command:
      - python
      - -m
      - wayfinding.demo.server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --artifact
      - /data/wayfinding.gpkg
    ports:
      - "127.0.0.1:${DTWIN_DEMO_HOST_PORT:-18007}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/demo/v1/health', timeout=2).read()"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
