x-build-image: &build-image ghcr.io/humanaxiom/sfu-digital-twin/wayfinding-build@sha256:PUBLISHED_DIGEST_REQUIRED

x-common: &common
  image: *build-image
  working_dir: /workspace
  volumes:
    - ..:/workspace:rw
    - ../build:/workspace/build:rw
  command: ["sleep", "infinity"]
  healthcheck:
    test: ["CMD-SHELL", "python --version >/dev/null && ogrinfo --version >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 5s

services:
  artifact:
    <<: *common

  source-etl:
    <<: *common
    volumes:
      - ..:/workspace:rw
      - ../build:/workspace/build:rw
      - C:/repos/sfudt/claude/dtwin-harness/data/IndoorWayfinding.gdb:/data/IndoorWayfinding.gdb:ro
