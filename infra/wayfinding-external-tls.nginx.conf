worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format bounded '$remote_addr [$time_local] $request_method $uri '
                       '$status $body_bytes_sent $request_time';
    access_log /dev/stdout bounded;
    sendfile on;
    keepalive_timeout 15s;
    client_max_body_size 128k;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server {
        listen 8007 ssl default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8007 ssl;
        server_name sfuai.ca;
        error_page 497 =307 https://sfuai.ca:8017$request_uri;

        location / {
            proxy_pass http://demo:8080;
            proxy_http_version 1.1;
            proxy_set_header Host demo;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
