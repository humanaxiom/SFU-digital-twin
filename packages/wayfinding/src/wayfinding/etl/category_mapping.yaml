# Controlled categories:
# - office, classroom, laboratory, washroom, corridor, vertical_circulation,
#   bookable_space, food_service, storage, infrastructure, amenity, retail, workshop, other
#
# Optional metadata flags:
# - accessible: bool — explicitly accessible (e.g., accessible washroom)
# - gender: str — male, female, neutral, unspecified
# - capacity: int — for bookable spaces (future use)

